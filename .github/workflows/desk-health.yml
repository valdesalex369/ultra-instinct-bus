name: Desk health tests

on:
  pull_request:
    paths:
      - 'tools/desk_health.py'
      - 'tests/test_desk_health.py'
      - '.github/workflows/desk-health.yml'
  push:
    branches:
      - 'nova/desk-health-truth-20261122'
    paths:
      - 'tools/desk_health.py'
      - 'tests/test_desk_health.py'
      - '.github/workflows/desk-health.yml'

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run deterministic offline tests
        run: python -m unittest discover -s tests -p 'test_desk_health.py' -v
